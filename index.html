<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1020" />
    <title>GymPro — Gym Management System</title>
    <style>
      /* ============================================================
   THEME TOKENS
   ============================================================ */
      :root {
        --bg: #0a1020;
        --bg-soft: #0f1830;
        --card: #121c33;
        --card-2: #0e1729;
        --text: #e8eefb;
        --muted: #8ea3c1;
        --border: #20304e;
        --accent: #3b82f6;
        --accent-2: #8b5cf6;
        --green: #10b981;
        --amber: #f59e0b;
        --red: #ef4444;
        --shadow: 0 12px 34px rgba(0, 0, 0, 0.38);
        --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.22);
        --radius: 16px;
        --sidebar-w: 262px;
        --ease: cubic-bezier(0.2, 0.8, 0.25, 1);
      }
      [data-theme="light"] {
        --bg: #eef3fb;
        --bg-soft: #ffffff;
        --card: #ffffff;
        --card-2: #f7fafd;
        --text: #0f172a;
        --muted: #5b6b85;
        --border: #dde5f0;
        --shadow: 0 12px 34px rgba(15, 23, 42, 0.1);
        --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.06);
      }

      /* ============================================================
   BASE
   ============================================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        transition:
          background 0.4s ease,
          color 0.35s ease;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        z-index: 0;
        pointer-events: none;
        opacity: 0.35;
        transition: opacity 0.5s ease;
      }
      body::before {
        width: 520px;
        height: 520px;
        top: -180px;
        left: -120px;
        background: radial-gradient(circle, #3b82f6, transparent 70%);
        animation: blob 18s ease-in-out infinite alternate;
      }
      body::after {
        width: 480px;
        height: 480px;
        bottom: -200px;
        right: -120px;
        background: radial-gradient(circle, #8b5cf6, transparent 70%);
        animation: blob 22s ease-in-out infinite alternate-reverse;
      }
      [data-theme="light"] body::before,
      [data-theme="light"] body::after {
        opacity: 0.2;
      }
      @keyframes blob {
        0% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(50px, 40px) scale(1.12);
        }
        100% {
          transform: translate(-30px, 60px) scale(0.95);
        }
      }

      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }

      /* ============================================================
   LAYOUT
   ============================================================ */
      .app {
        display: flex;
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }

      /* SIDEBAR */
      .sidebar {
        width: var(--sidebar-w);
        flex: 0 0 var(--sidebar-w);
        background: color-mix(in srgb, var(--bg-soft) 88%, transparent);
        backdrop-filter: blur(18px);
        border-right: 1px solid var(--border);
        height: 100vh;
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        padding: 22px 14px;
        transition: transform 0.35s var(--ease);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 4px 10px 20px;
      }
      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        font-size: 20px;
        box-shadow: 0 8px 22px rgba(59, 130, 246, 0.4);
        animation: floaty 4s ease-in-out infinite;
      }
      @keyframes floaty {
        50% {
          transform: translateY(-4px) rotate(-3deg);
        }
      }
      .brand-txt b {
        display: block;
        font-size: 18px;
        letter-spacing: -0.3px;
      }
      .brand-txt span {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 6px;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border-radius: 12px;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 14.5px;
        font-weight: 600;
        text-align: left;
        width: 100%;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.2s;
        position: relative;
      }
      .nav-item i {
        font-style: normal;
        font-size: 17px;
        width: 22px;
        text-align: center;
      }
      .nav-item:hover {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        color: var(--text);
        transform: translateX(3px);
      }
      .nav-item.active {
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent) 26%, transparent),
          color-mix(in srgb, var(--accent-2) 20%, transparent)
        );
        color: var(--text);
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 22%;
        height: 56%;
        width: 3px;
        border-radius: 3px;
        background: linear-gradient(var(--accent), var(--accent-2));
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 14px 10px 4px;
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.6;
        border-top: 1px solid var(--border);
      }
      .sidebar-foot b {
        color: var(--text);
      }
      .live-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        margin-right: 6px;
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
        }
        70% {
          box-shadow: 0 0 0 9px rgba(16, 185, 129, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
        }
      }

      /* MAIN */
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 26px;
        background: color-mix(in srgb, var(--bg) 78%, transparent);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
      }
      .hamburger {
        display: none;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
        place-items: center;
      }
      .titles {
        flex: 1;
        min-width: 0;
      }
      .titles h1 {
        font-size: 20px;
        letter-spacing: -0.4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .titles p {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .clock {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        padding: 8px 13px;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: var(--card);
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        box-shadow: 0 6px 18px rgba(59, 130, 246, 0.35);
        cursor: pointer;
        transition: transform 0.2s;
      }
      .avatar:hover {
        transform: scale(1.07);
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 16px;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .icon-btn:hover {
        transform: translateY(-2px);
        background: var(--card-2);
      }

      /* VIEW */
      .view {
        padding: 24px 26px 60px;
        flex: 1;
      }
      .page {
        animation: pageIn 0.5s var(--ease) both;
      }
      @keyframes pageIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ============================================================
   COMPONENTS
   ============================================================ */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.25s var(--ease),
          box-shadow 0.25s,
          border-color 0.25s;
        animation: cardIn 0.55s var(--ease) both;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card:hover {
        box-shadow: var(--shadow);
        border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .card-head h3 {
        font-size: 15.5px;
        letter-spacing: -0.2px;
      }
      .card-head .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }

      .grid {
        display: grid;
        gap: 18px;
      }
      .stats {
        grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
        margin-bottom: 18px;
      }
      .two-col {
        grid-template-columns: 1.9fr 1fr;
        margin-bottom: 18px;
      }
      .two-col-b {
        grid-template-columns: 1.9fr 1fr;
      }
      @media (max-width: 1050px) {
        .two-col,
        .two-col-b {
          grid-template-columns: 1fr;
        }
      }

      .stat {
        position: relative;
        overflow: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: default;
        box-shadow: var(--shadow-sm);
        animation: cardIn 0.55s var(--ease) both;
        transition:
          transform 0.25s var(--ease),
          box-shadow 0.25s;
      }
      .stat:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow);
      }
      .stat::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent) 60%, transparent),
          transparent 55%
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .stat:hover::after {
        opacity: 1;
      }
      .stat-ico {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 21px;
        flex: 0 0 48px;
      }
      .stat-val {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.6px;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
      }
      .stat-lbl {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition:
          transform 0.16s var(--ease),
          box-shadow 0.2s,
          filter 0.2s;
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.28);
        white-space: nowrap;
      }
      .btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
        box-shadow: 0 10px 24px rgba(59, 130, 246, 0.38);
      }
      .btn:active {
        transform: translateY(0) scale(0.97);
      }
      .btn-ghost {
        background: var(--card);
        border-color: var(--border);
        color: var(--text);
        box-shadow: none;
      }
      .btn-ghost:hover {
        background: var(--card-2);
        box-shadow: var(--shadow-sm);
      }
      .btn-green {
        background: linear-gradient(135deg, #10b981, #059669);
        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
      }
      .btn-red {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        box-shadow: 0 6px 16px rgba(239, 68, 68, 0.3);
      }
      .btn-amber {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        box-shadow: 0 6px 16px rgba(245, 158, 11, 0.3);
      }
      .btn-sm {
        padding: 6px 11px;
        font-size: 12px;
        border-radius: 9px;
        box-shadow: none;
      }
      .btn-block {
        width: 100%;
      }

      .input,
      .select,
      textarea.input {
        width: 100%;
        padding: 11px 13px;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: var(--card-2);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
        outline: none;
      }
      .input:focus,
      .select:focus,
      textarea.input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--muted) 50%),
          linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) 50%,
          calc(100% - 13px) 50%;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
        padding-right: 34px;
      }
      label.fl {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
      }

      /* TOOLBAR */
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 18px;
      }
      .search {
        position: relative;
        flex: 1;
        min-width: 200px;
      }
      .search input {
        padding-left: 38px;
      }
      .search span {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 14px;
        pointer-events: none;
      }
      .toolbar .select {
        width: auto;
        min-width: 135px;
      }

      /* TABLES */
      .table-wrap {
        overflow-x: auto;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }
      th,
      td {
        padding: 13px 14px;
        text-align: left;
        font-size: 13.5px;
        white-space: nowrap;
      }
      thead th {
        background: var(--card-2);
        color: var(--muted);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        font-weight: 700;
        position: sticky;
        top: 0;
      }
      tbody tr {
        border-top: 1px solid var(--border);
        transition:
          background 0.18s,
          transform 0.18s;
      }
      tbody tr:hover {
        background: color-mix(in srgb, var(--accent) 6%, transparent);
      }
      td.num {
        font-variant-numeric: tabular-nums;
      }

      .person {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .pic {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        flex: 0 0 36px;
        letter-spacing: 0.4px;
      }
      .person b {
        display: block;
        font-size: 13.5px;
      }
      .person small {
        color: var(--muted);
        font-size: 11.5px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }
      .b-green {
        background: color-mix(in srgb, var(--green) 18%, transparent);
        color: var(--green);
      }
      .b-red {
        background: color-mix(in srgb, var(--red) 18%, transparent);
        color: var(--red);
      }
      .b-amber {
        background: color-mix(in srgb, var(--amber) 18%, transparent);
        color: var(--amber);
      }
      .b-blue {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: var(--accent);
      }
      .b-gray {
        background: color-mix(in srgb, var(--muted) 18%, transparent);
        color: var(--muted);
      }

      .row-actions {
        display: flex;
        gap: 6px;
      }

      .empty {
        padding: 48px 20px;
        text-align: center;
        color: var(--muted);
      }
      .empty .big {
        font-size: 38px;
        margin-bottom: 10px;
        opacity: 0.65;
        display: block;
        animation: floaty 3s ease-in-out infinite;
      }

      /* CHART: BARS */
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 190px;
        padding-top: 10px;
      }
      .bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
        gap: 7px;
        min-width: 0;
      }
      .bar-val {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        text-align: center;
        height: 14px;
        font-variant-numeric: tabular-nums;
      }
      .bar-track {
        position: relative;
        height: 100%;
        display: flex;
        align-items: flex-end;
        border-radius: 10px;
        background: color-mix(in srgb, var(--muted) 8%, transparent);
      }
      .bar-fill {
        width: 100%;
        border-radius: 9px 9px 5px 5px;
        background: linear-gradient(180deg, var(--accent-2), var(--accent));
        transform-origin: bottom;
        animation: growBar 0.85s var(--ease) both;
        box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 40%, transparent);
        transition: filter 0.2s;
      }
      .bar-col:hover .bar-fill {
        filter: brightness(1.25);
      }
      @keyframes growBar {
        from {
          transform: scaleY(0);
        }
        to {
          transform: scaleY(1);
        }
      }
      .bar-label {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        font-weight: 600;
      }

      /* DONUT */
      .donut-wrap {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .donut {
        width: 150px;
        height: 150px;
        flex: 0 0 150px;
        animation: popIn 0.8s var(--ease) both;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.75) rotate(-20deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .donut-center {
        fill: var(--text);
        font-size: 20px;
        font-weight: 800;
      }
      .donut-center-sub {
        fill: var(--muted);
        font-size: 8.5px;
        letter-spacing: 1.5px;
      }
      .legend {
        display: flex;
        flex-direction: column;
        gap: 9px;
        flex: 1;
        min-width: 130px;
      }
      .legend div {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .legend i {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        flex: 0 0 9px;
      }
      .legend b {
        margin-left: auto;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      /* PLAN CARDS */
      .plan-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
        gap: 18px;
      }
      .plan {
        position: relative;
        background: var(--card);

      function ago(iso) {
        if (!iso) return "—";
        const diff =
          Date.now() - new Date(String(iso).replace(" ", "T")).getTime();
        const m = Math.floor(diff / 60000);
        if (m < 1) return "just now";
        if (m < 60) return m + "m ago";
        const h = Math.floor(m / 60);
        if (h < 24) return h + "h ago";
        const d = Math.floor(h / 24);
        if (d < 30) return d + "d ago";
        return Math.floor(d / 30) + "mo ago";
      }

        const s = Math.max(
          0,
          Math.floor(
            (Date.now() - new Date(String(iso).replace(" ", "T")).getTime()) /
              1000,
          ),
        );
        return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
      }

      function loadDB() {
        try {
          const raw = localStorage.getItem(KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.members)) return parsed;
          }
        } catch (e) {
          console.warn("Corrupt storage, reseeding.", e);
        }
        const fresh = seedDemo();
        localStorage.setItem(KEY, JSON.stringify(fresh));
        return fresh;
      }

      let db = loadDB();

      /* ---- derived helpers ---- */
      const planOf = (id) => db.plans.find((p) => p.id === id);
      const memberOf = (id) => db.members.find((m) => m.id === id);
      const startOfToday = () => {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d;
      };

      function expiresOn(m) {
        const p = planOf(m.planId);
        if (!p || !m.lastPayment) return null;
        const d = parseDate(m.lastPayment);
        d.setDate(d.getDate() + (p.days || 30));
        return d;
      }
      function daysLeft(m) {
        const e = expiresOn(m);
        if (!e) return null;
        return Math.ceil((e - startOfToday()) / 86400000);
      }
      function memberStatus(m) {
        if (m.status === "inactive")
          return { cls: "b-gray", label: "Inactive" };
        if (m.checkedIn) return { cls: "b-green", label: "In Gym" };
        const d = daysLeft(m);
        if (d === null) return { cls: "b-blue", label: "Active" };
        if (d < 0) return { cls: "b-red", label: "Expired" };
        if (d <= 7) return { cls: "b-amber", label: "Expiring" };
        return { cls: "b-green", label: "Active" };
      }
      const revenueForMonth = (key) =>
        db.payments
          .filter((p) => (p.date || "").startsWith(key))
          .reduce((s, p) => s + Number(p.amount || 0), 0);

      function toast(msg, type = "info", title) {
        const host = $("#toasts");
        const el = document.createElement("div");
        el.className = "toast " + type;
        const icon = type === "ok" ? "✅" : type === "err" ? "⚠️" : "ℹ️";
        el.innerHTML = `<i>${icon}</i><div><b>${esc(title || (type === "ok" ? "Success" : type === "err" ? "Something went wrong" : "Info"))}</b><span>${esc(msg)}</span></div>`;
        host.appendChild(el);
        const kill = () => {
          el.classList.add("out");
          setTimeout(() => el.remove(), 320);
        };
        el.addEventListener("click", kill);
        setTimeout(kill, 3200);
      }

      function closeModal() {
        const root = $("#modalRoot");

        setTimeout(() => {
          root.innerHTML = "";
        }, 160);

      function openModal({
        title,
        sub = "",
        body,
        submitLabel = "Save",
        onSubmit,
        wide = false,
      }) {
        const root = $("#modalRoot");
        root.innerHTML = `
    <div class="backdrop" data-close>
      <div class="sheet" role="dialog" aria-modal="true" style="${wide ? "max-width:720px" : ""}">
        <div class="sheet-head">
          <div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div>

        </div>
        <form id="modalForm" novalidate>
          <div class="sheet-body">${body}</div>
          <div class="sheet-foot">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="submit" class="btn">${esc(submitLabel)}</button>
          </div>
        </form>
      </div>
    </div>`;
        const form = $("#modalForm");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const res = onSubmit(Object.fromEntries(new FormData(form)), form);
          if (res !== false) closeModal();
        });
        const first = form.querySelector("input,select,textarea");
        if (first && window.matchMedia("(min-width:700px)").matches)
          setTimeout(() => first.focus(), 220);
      }

      function confirmDialog(message, okLabel = "Delete") {
        return new Promise((resolve) => {
          openModal({
            title: "Are you sure?",
            sub: "This action cannot be undone.",
            body: `<p style="font-size:14px;line-height:1.65;color:var(--muted)">${esc(message)}</p>`,
            submitLabel: okLabel,
            onSubmit: () => {
              resolve(true);
            },
          });
          const foot = $("#modalRoot .sheet-foot .btn");
          if (foot) {
            foot.classList.remove("btn");
            foot.classList.add("btn", "btn-red");
          }
          // if closed without confirming, resolve false
          const obs = new MutationObserver(() => {
            if (!$("#modalRoot").firstElementChild) {
              obs.disconnect();
              resolve(false);
            }
          });
          obs.observe($("#modalRoot"), { childList: true });
        });
      }

      function renderBarChart() {
        const months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date();
          d.setMonth(d.getMonth() - i);
          months.push(monthKey(d));
        }
        const vals = months.map(revenueForMonth);
        const max = Math.max(...vals, 1);
        return `<div class="chart">
    ${months
      .map((k, i) => {
        const v = vals[i];
        const h = Math.max(4, Math.round((v / max) * 100));
        return `<div class="bar-col" title="${monthLabel(k)} ${k.split("-")[0]}: ${money(v)}">
        <div class="bar-val">${v ? shortMoney(v) : ""}</div>
        <div class="bar-track"><div class="bar-fill" style="height:${h}%;animation-delay:${i * 80}ms"></div></div>
        <div class="bar-label">${monthLabel(k)}</div>
      </div>`;
      })
      .join("")}
  </div>`;
      }

      function renderDonut() {
        const rows = db.plans.map((p) => ({
          p,
          n: db.members.filter((m) => m.planId === p.id).length,
        }));
        const total = rows.reduce((s, r) => s + r.n, 0) || 1;
        const r = 54,
          C = 2 * Math.PI * r;
        let offset = 0;
        const segs = rows
          .map((row) => {
            const len = (row.n / total) * C;
            const seg =
              len > 0
                ? `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${row.p.color}" stroke-width="15"
           stroke-dasharray="${len - 2} ${C - len + 2}" stroke-dashoffset="${-offset}"
           transform="rotate(-90 60 60)" style="transition:opacity .3s"/>`
                : "";
            offset += len;
            return seg;
          })
          .join("");

        return `<div class="donut-wrap">
    <svg class="donut" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="color-mix(in srgb,var(--muted) 15%,transparent)" stroke-width="15"/>
      ${segs}
      <text x="60" y="58" text-anchor="middle" class="donut-center">${total}</text>
      <text x="60" y="73" text-anchor="middle" class="donut-center-sub">MEMBERS</text>
    </svg>
    <div class="legend">
      ${rows.map((row) => `<div><i style="background:${row.p.color}"></i>${esc(row.p.name)}<b>${row.n}</b></div>`).join("")}
    </div>
  </div>`;
      }

      function animateCounters() {
        $$(".count").forEach((el) => {
          const to = Number(el.dataset.to) || 0;
          const pre = el.dataset.prefix || "";
          const dur = 900,
            start = performance.now();
          const step = (now) => {
            const t = Math.min(1, (now - start) / dur);
            const eased = 1 - Math.pow(1 - t, 3);
            el.textContent =
              pre + Math.round(to * eased).toLocaleString("en-IN");
            if (t < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        });
      }

      /* ---------- MEMBERS ---------- */
      function filteredMembers() {
        const q = App.q.trim().toLowerCase();
        let list = db.members.filter((m) => {
          const matchQ =
            !q ||
            m.name.toLowerCase().includes(q) ||
            m.phone.includes(q) ||
            (m.email || "").toLowerCase().includes(q);
          const st = memberStatus(m);
          const matchS =
            App.status === "all" ||
            (App.status === "active" &&
              m.status !== "inactive" &&
              (daysLeft(m) === null || daysLeft(m) >= 0)) ||
            (App.status === "expired" &&
              daysLeft(m) !== null &&
              daysLeft(m) < 0) ||
            (App.status === "inactive" && m.status === "inactive") ||
            (App.status === "in" && m.checkedIn);
          return matchQ && matchS;
        });
        const sorters = {
          recent: (a, b) => (b.joinDate || "").localeCompare(a.joinDate || ""),
          name: (a, b) => a.name.localeCompare(b.name),
          expiry: (a, b) => (daysLeft(a) ?? 9999) - (daysLeft(b) ?? 9999),
          plan: (a, b) =>
            (planOf(a.planId)?.price || 0) - (planOf(b.planId)?.price || 0),
        };
        return list.sort(sorters[App.sort] || sorters.recent);
      }

        openModal({

          sub: m
            ? "Update the details below"
            : "Fill in the member information",
          submitLabel: m ? "Save changes" : "Add member",
          body: `
      <div class="fg"><label class="fl">Full name *</label><input class="input" name="name" required value="${m ? esc(m.name) : ""}" placeholder="e.g. Sourabh Singh"></div>
      <div class="grid2">

        <div class="fg"><label class="fl">Email</label><input class="input" type="email" name="email" value="${m ? esc(m.email || "") : ""}" placeholder="name@mail.com"></div>
      </div>
      <div class="grid2">
        <div class="fg"><label class="fl">Age</label><input class="input" type="number" name="age" min="10" max="100" value="${m ? esc(m.age) : ""}"></div>
        <div class="fg"><label class="fl">Gender</label>
          <select class="select" name="gender">
            ${["Male", "Female", "Other"].map((g) => `<option ${m && m.gender === g ? "selected" : ""}>${g}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="fg"><label class="fl">Plan</label>
          <select class="select" name="planId">
            ${db.plans.map((p) => `<option value="${p.id}" ${m && m.planId === p.id ? "selected" : !m && p.popular ? "selected" : ""}>${esc(p.name)} — ${money(p.price)}</option>`).join("")}
          </select>
        </div>
        <div class="fg"><label class="fl">Status</label>
          <select class="select" name="status">
            <option value="active" ${!m || m.status === "active" ? "selected" : ""}>Active</option>
            <option value="inactive" ${m && m.status === "inactive" ? "selected" : ""}>Inactive</option>
          </select>
        </div>
      </div>`,
          onSubmit: (data) => {
            if (!data.name.trim() || !data.phone.trim()) {
              toast("Name and phone are required.", "err", "Missing details");
              return false;
            }
            if (m) {
              Object.assign(m, {
                name: data.name.trim(),
                phone: data.phone.trim(),
                email: data.email.trim(),
                age: data.age,
                gender: data.gender,
                planId: data.planId,
                status: data.status,
              });
              save();
              toast(`${m.name}'s profile updated.`, "ok", "Saved");
            } else {
              db.members.push({
                id: uid(),
                name: data.name.trim(),
                phone: data.phone.trim(),
                email: data.email.trim(),
                age: data.age,
                gender: data.gender,
                planId: data.planId,
                status: data.status,
                checkedIn: false,
                joinDate: isoDate(),
                lastPayment: null,
              });
              save();
              toast(
                `${data.name.trim()} has been added.`,
                "ok",
                "Member added",
              );
            }
            rerender();
            updateLiveCount();
          },
        });
      }

      async function removeMember(id) {
        const m = memberOf(id);
        if (!m) return;
        const ok = await confirmDialog(
          `Delete ${m.name}? Their payment and attendance history will also be removed.`,
          "Delete member",
        );
        if (!ok) return;
        db.members = db.members.filter((x) => x.id !== id);
        db.payments = db.payments.filter((p) => p.memberId !== id);
        db.attendance = db.attendance.filter((a) => a.memberId !== id);
        db.workouts.forEach((w) => {
          if (w.memberId === id) w.memberId = "";
        });
        save();
        toast(`${m.name} was deleted.`, "ok", "Removed");
        rerender();
        updateLiveCount();
      }

          <input class="input" type="number" name="amount" min="1" required id="payAmount" value="${first && planOf(first.planId) ? planOf(first.planId).price : ""}">
        </div>
        <div class="fg"><label class="fl">Method</label>
          <select class="select" name="method">
            <option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option>
          </select>
        </div>
      </div>
      <div class="fg"><label class="fl">Plan</label>
        <select class="select" name="planId" id="payPlan">
          ${db.plans.map((p) => `<option value="${p.id}" ${first && first.planId === p.id ? "selected" : ""}>${esc(p.name)} — ${money(p.price)}</option>`).join("")}
        </select>
      </div>`,
          onSubmit: (data) => {
            const m = memberOf(data.memberId);
            if (!m) {
              toast("Please select a member.", "err");
              return false;
            }
            const amount = Number(data.amount);
            if (!amount || amount <= 0) {
              toast("Enter a valid amount.", "err");
              return false;
            }
            db.payments.push({
              id: uid(),
              memberId: m.id,
              memberName: m.name,
              amount,
              planId: data.planId,
              method: data.method,
              date: isoDate(),
            });
            m.lastPayment = isoDate();
            if (m.status === "inactive") m.status = "active";
            save();
            toast(
              `${money(amount)} recorded for ${m.name}.`,
              "ok",
              "Payment saved",
            );
            rerender();
            updateLiveCount();
          },
        });
        const sel = $("#payMember");
        if (sel)
          sel.addEventListener("change", () => {
            const m = memberOf(sel.value);
            const p = m ? planOf(m.planId) : null;
            if (p) {
              $("#payAmount").value = p.price;
              $("#payPlan").value = p.id;
            }
          });
      }

      function removePayment(id) {
        const p = db.payments.find((x) => x.id === id);
        if (!p) return;
        db.payments = db.payments.filter((x) => x.id !== id);
        save();
        toast("Payment record deleted.", "ok");
        rerender();
      }

      function planModal(id) {
        const p = id ? planOf(id) : null;
        const colors = [
          "#3b82f6",
          "#8b5cf6",
          "#f59e0b",
          "#10b981",
          "#ef4444",
          "#06b6d4",
        ];
        openModal({
          title: p ? "Edit plan" : "New plan",
          sub: "Define pricing and features",
          submitLabel: p ? "Save plan" : "Create plan",
          body: `
      <div class="fg"><label class="fl">Plan name *</label><input class="input" name="name" required value="${p ? esc(p.name) : ""}" placeholder="e.g. Premium"></div>
      <div class="grid2">
        <div class="fg"><label class="fl">Price (₹) *</label><input class="input" type="number" name="price" min="1" required value="${p ? p.price : ""}"></div>
        <div class="fg"><label class="fl">Duration</label><input class="input" name="duration" value="${p ? esc(p.duration) : "1 Month"}" placeholder="1 Month"></div>
      </div>
      <div class="grid2">
        <div class="fg"><label class="fl">Days valid</label><input class="input" type="number" name="days" min="1" value="${p ? p.days : 30}"></div>
        <div class="fg"><label class="fl">Colour</label>
          <select class="select" name="color">
            ${colors.map((c) => `<option value="${c}" ${p && p.color === c ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="fg"><label class="fl">Features (comma separated)</label><input class="input" name="features" value="${p ? esc((p.features || []).join(", ")) : "Gym Access, Locker Room"}"></div>`,
          onSubmit: (data) => {
            if (!data.name.trim() || !Number(data.price)) {
              toast("Name and price are required.", "err");
              return false;
            }
            const payload = {
              name: data.name.trim(),
              price: Number(data.price),
              duration: data.duration.trim() || "1 Month",
              days: Number(data.days) || 30,
              color: data.color,
              features: data.features
                .split(",")
                .map((s) => s.trim())
                .filter(Boolean),
            };
            if (p) Object.assign(p, payload);
            else db.plans.push({ id: "plan_" + uid(), ...payload });
            save();
            toast(p ? "Plan updated." : "New plan created.", "ok");
            rerender();
          },
        });
      }

      async function removePlan(id) {
        const p = planOf(id);
        const used = db.members.filter((m) => m.planId === id).length;
        if (used) {
          toast(
            `${used} member(s) are on this plan. Move them first.`,
            "err",
            "Cannot delete",
          );
          return;
        }
        const ok = await confirmDialog(
          `Delete the "${p.name}" plan?`,
          "Delete plan",
        );
        if (!ok) return;
        db.plans = db.plans.filter((x) => x.id !== id);
        save();
        toast("Plan deleted.", "ok");
        rerender();
      }

      function workoutModal(id) {
        const w = id ? db.workouts.find((x) => x.id === id) : null;
        openModal({
          title: w ? "Edit workout" : "New workout",
          sub: "Assign a program to a member",
          submitLabel: w ? "Save workout" : "Create workout",
          body: `
      <div class="fg"><label class="fl">Workout name *</label><input class="input" name="name" required value="${w ? esc(w.name) : ""}" placeholder="e.g. Push Pull Legs"></div>
      <div class="fg"><label class="fl">Assign to member</label>
        <select class="select" name="memberId">
          <option value="">Unassigned</option>
          ${db.members.map((m) => `<option value="${m.id}" ${w && w.memberId === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
        </select>
      </div>
      <div class="fg"><label class="fl">Description</label><textarea class="input" name="description" rows="2" placeholder="Short summary…">${w ? esc(w.description || "") : ""}</textarea></div>
      <div class="fg"><label class="fl">Exercises (comma separated)</label><input class="input" name="exercises" value="${w ? esc((w.exercises || []).join(", ")) : ""}" placeholder="Squats 3x12, Bench 3x10"></div>`,
          onSubmit: (data) => {
            if (!data.name.trim()) {
              toast("Workout name is required.", "err");
              return false;
            }
            const payload = {
              name: data.name.trim(),
              memberId: data.memberId,
              description: data.description.trim(),
              exercises: data.exercises
                .split(",")
                .map((s) => s.trim())
                .filter(Boolean),
            };
            if (w) Object.assign(w, payload);
            else db.workouts.push({ id: uid(), ...payload });
            save();
            toast(w ? "Workout updated." : "Workout created.", "ok");
            rerender();
          },
        });
      }

      async function removeWorkout(id) {
        const ok = await confirmDialog(
          "Delete this workout program?",
          "Delete workout",
        );
        if (!ok) return;
        db.workouts = db.workouts.filter((x) => x.id !== id);
        save();
        toast("Workout deleted.", "ok");
        rerender();
      }

      /* ---------- ATTENDANCE ACTIONS ---------- */
      function doCheckIn(memberId) {
        const id = memberId || ($("#ciSelect") ? $("#ciSelect").value : "");
        if (!id) {
          toast("Select a member to check in.", "err");
          return;
        }
        const m = memberOf(id);
        if (!m) return;
        if (m.checkedIn) {
          toast(`${m.name} is already checked in.`, "err");
          return;
        }
        m.checkedIn = true;
        db.attendance.unshift({
          id: uid(),
          memberId: m.id,
          memberName: m.name,
          checkIn: isoNow(),
          checkOut: null,
        });
        save();
        toast(
          `${m.name} checked in. Have a great session!`,
          "ok",
          "Checked in",
        );
        rerender();
        updateLiveCount();
      }

      function doCheckOut(memberId) {
        const m = memberOf(memberId);
        if (!m) return;
        const rec = db.attendance.find(
          (a) => a.memberId === m.id && !a.checkOut,
        );
        if (!rec) {
          toast(`${m.name} is not checked in.`, "err");
          return;
        }
        rec.checkOut = isoNow();
        m.checkedIn = false;
        const mins = Math.max(
          1,
          Math.round(
            (new Date(rec.checkOut.replace(" ", "T")) -
              new Date(rec.checkIn.replace(" ", "T"))) /
              60000,
          ),
        );
        save();
        toast(`${m.name} checked out after ${mins} min.`, "ok", "Checked out");
        rerender();
        updateLiveCount();
      }

      /* ---------- DATA ---------- */
      function exportData() {
        const blob = new Blob([JSON.stringify(db, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `gympro-backup-${isoDate()}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        toast("Backup file downloaded.", "ok", "Export complete");
      }

      async function resetDemo() {
        const ok = await confirmDialog(
          "Replace all current data with demo members and payments?",
          "Reset demo data",
        );
        if (!ok) return;
        db = seedDemo();
        db.settings = { theme: db.settings?.theme || "dark" };
        save();
        toast("Demo data loaded.", "ok");
        go("dashboard");
        updateLiveCount();
      }

      async function clearData() {
        const ok = await confirmDialog(
          "Permanently delete every member, payment and workout?",
          "Clear everything",
        );
        if (!ok) return;
        const theme = db.settings.theme;
        db = {
          members: [],
          payments: [],
          attendance: [],
          workouts: [],
          plans: defaultPlans(),
          settings: { theme },
          version: 2,
        };
        save();
        toast("All data cleared.", "ok");
        go("dashboard");
        updateLiveCount();
      }

      function importData(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!data || !Array.isArray(data.members))
              throw new Error("Invalid file");
            db = { ...db, ...data, settings: db.settings };
            save();
            toast("Backup restored successfully.", "ok");
            go("dashboard");
            updateLiveCount();
          } catch (err) {
            toast(
              "That file is not a valid GymPro backup.",
              "err",
              "Import failed",
            );
          }
        };
        reader.readAsText(file);
      }

      /* ============================================================
   5. THEME
   ============================================================ */
      function applyTheme() {
        document.documentElement.setAttribute(
          "data-theme",
          db.settings.theme || "dark",
        );
        const btn = $("#themeBtn");
        if (btn)
          btn.textContent =
            (db.settings.theme || "dark") === "dark" ? "🌙" : "☀️";
      }
      function setTheme(val) {
        db.settings.theme = val;
        save();
        applyTheme();
        toast(`Switched to ${val} mode.`, "ok", "Theme updated");
        if (App.page === "settings") rerender();
      }
      function toggleTheme() {
        setTheme((db.settings.theme || "dark") === "dark" ? "light" : "dark");
      }

      function updateLiveCount() {
        const n = db.members.filter((m) => m.checkedIn).length;
        const el = $("#liveCount");
        if (el) el.textContent = n;
      }

      /* ============================================================
   6. EVENT WIRING
   ============================================================ */
      const actions = {
        nav: (el) => go(el.dataset.page),
        "toggle-nav": () => document.body.classList.toggle("nav-open"),
        "close-nav": () => document.body.classList.remove("nav-open"),
        theme: () => toggleTheme(),
        "set-theme": (el) => setTheme(el.dataset.themeVal),
        "close-modal": () => closeModal(),

        "add-member": () => memberFormModal(),
        "edit-member": (el) => memberFormModal(el.dataset.id),
        "view-member": (el) => viewMember(el.dataset.id),
        "del-member": (el) => removeMember(el.dataset.id),

        "add-payment": (el) => paymentModal(el.dataset.id),
        "del-payment": (el) => removePayment(el.dataset.id),

        "add-plan": () => planModal(),
        "edit-plan": (el) => planModal(el.dataset.id),
        "del-plan": (el) => removePlan(el.dataset.id),

        "add-workout": () => workoutModal(),
        "edit-workout": (el) => workoutModal(el.dataset.id),
        "del-workout": (el) => removeWorkout(el.dataset.id),

        checkin: () => doCheckIn(),
        "checkin-member": (el) => {
          closeModal();
          setTimeout(() => doCheckIn(el.dataset.id), 180);
        },
        checkout: (el) => doCheckOut(el.dataset.id),

        "export-data": () => exportData(),
        "import-data": () => $("#importFile").click(),
        "reset-demo": () => resetDemo(),
        "clear-data": () => clearData(),
      };

      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-action]");
        if (t) {
          const fn = actions[t.dataset.action];
          if (fn) {
            e.preventDefault();
            fn(t);
            return;
          }
        }
        // drawer backdrop / modal backdrop dismiss
        if (e.target.matches("[data-close]")) closeModal();
        // mobile nav overlay
        if (
          document.body.classList.contains("nav-open") &&
          !e.target.closest(".sidebar") &&
          !e.target.closest('[data-action="toggle-nav"]')
        ) {
          document.body.classList.remove("nav-open");
        }
      });

      document.addEventListener("input", (e) => {
        if (e.target.id === "memberSearch") {
          App.q = e.target.value;
          refreshMemberRows();
        }
      });

      document.addEventListener("change", (e) => {
        const sel = e.target.dataset.select;
        if (sel === "status") {
          App.status = e.target.value;
          refreshMemberRows();
        }
        if (sel === "sort") {
          App.sort = e.target.value;
          refreshMemberRows();
        }
        if (sel === "payFilter") {
          App.payFilter = e.target.value;
          rerender();
        }
        if (sel === "attFilter") {
          App.attFilter = e.target.value;
          rerender();
        }
        if (e.target.id === "importFile" && e.target.files[0])
          importData(e.target.files[0]);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeModal();
          document.body.classList.remove("nav-open");
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          if (App.page !== "members") go("members");
          setTimeout(() => {
            const s = $("#memberSearch");
            if (s) {
              s.focus();
              s.select();
            }
          }, 120);
        }
        // G then M
        if (
          e.key.toLowerCase() === "g" &&
          !e.ctrlKey &&
          !e.metaKey &&
          !/input|textarea|select/i.test(document.activeElement.tagName)
        ) {
          window.__gPressed = true;
          setTimeout(() => {
            window.__gPressed = false;
          }, 900);
        } else if (
          e.key.toLowerCase() === "m" &&
          window.__gPressed &&
          !/input|textarea|select/i.test(document.activeElement.tagName)
        ) {
          go("members");
          window.__gPressed = false;
        }
      });

      /* live timers + clock */
      setInterval(() => {
        $$("[data-since]").forEach((el) => {
          el.textContent = elapsed(el.dataset.since);
        });
        const c = $("#clock");
        if (c) {
          const d = new Date();
          c.textContent = d.toLocaleTimeString("en-IN", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        }
      }, 1000);

      /* boot */
      function boot() {
        applyTheme();
        go("dashboard");
        updateLiveCount();
        setTimeout(
          () =>
            toast(
              "Welcome back! Demo data is loaded — manage it from Settings.",
              "info",
              "GymPro ready",
            ),
          700,
        );
      }
      boot();
    </script>
  </body>
</html>
